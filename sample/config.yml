# stockscan 설정 — 사람이 정하는 것은 이게 전부입니다.
#
#   ~/.stockscan/config.yml 에 두면 인자 없이 실행됩니다.
#
#     cp sample/* ~/.stockscan/     # 설정과 전략을 함께 — 전략은 설정 파일 옆에서 찾습니다
#     uv run stockscan run
#
# 배선(유니버스 → 봉 수집 → 전략 → 기록 → 로그)은 코드에 고정돼 있습니다.
# 예전에는 이 파일에 노드 6개와 엣지 5개를 적었는데, 만들어지는 조합이 언제나
# 하나라서 그 형식이 값을 못 했습니다 (2026-08-06).

timezone: Asia/Seoul


# 무엇을 훑을 것인가 — venue별로 몇 종목까지.
#
# 손으로 종목을 적지 않습니다. 종목을 고정해 두면 "혼자서는 볼 수 없는 범위를
# 대신 본다"는 목적에 닿지 않습니다. 컷 방식은 소스의 능력에서 유도됩니다 —
# KRX 목록에는 거래대금이 실려 오므로 **거래대금 상위 N**, 미국 목록에는 거래대금이
# 아예 없으므로 **목록 앞 N**입니다.
universe:
  krx: 200
  nasdaq: 100


# 어떤 전략으로 — 같은 디렉터리의 <이름>.py 를 찾습니다.
#
# ★ 파라미터는 여기에 적지 않습니다. 전략 파일의 Params 기본값이 정본입니다.
#   값이 "왜 이 값인가"를 적은 docstring 바로 옆에 있어야, 설정에서 슬쩍 바꿔
#   돌려 보는 경로가 생기지 않습니다 (§4.8 백테스트를 대하는 자세).
strategy: trend_breakout_55


# 언제 돌 것인가 — `serve`가 이 시각에 `run --commit`을 부릅니다.
#
# ★ 시각은 로컬 기준으로 적습니다. 마감에서 자동으로 유도하지 않는 이유는
#   서머타임입니다 — 미국장 마감은 한국 시각으로 1년에 두 번 한 시간씩 움직이는데,
#   유도한 값은 그 사실을 어디에도 남기지 않습니다.
#
# 시장을 나누지 않습니다. Fresh Bar Gate(§3.5)가 새로 마감된 봉이 없는 시장을
# 알아서 제외하므로, 그 시각에 봉이 있는 시장만 판정됩니다.
#
# ★ 주말에는 발화도 하트비트도 하지 않습니다 — **설정 항목이 아니라 기본값입니다.**
#   판정은 UTC 요일로 하므로 아래 "06:10"은 토요일에도 그대로 돕니다(금 21:10 UTC).
#   미국장 금요일 마감 직후라, 로컬 요일로 잘랐다면 금요일 미국 신호가 사라집니다.
schedule:
  at:
    - "15:40"     # KRX 마감(15:30) 뒤
    - "06:10"     # 미국장 마감 뒤 — ⚠️ 서머타임에 05:00/06:00으로 움직입니다

  # ★ 신호가 0건이어도 하루 1회 보냅니다. 이게 없으면 "신호가 없는 것"과
  #   "프로세스가 죽은 것"이 구분되지 않습니다 (§8).
  heartbeat: "09:00"

  # ★★ 성적표 — **이 프로젝트의 제품입니다** (§4.8). 매월 이 날 하트비트 시각에
  #    함께 나갑니다. 일일 알림은 원료고, "내가 정한 규칙이 실제로 어땠는가"에
  #    답하는 것은 이 메시지입니다. null로 두면 보내지 않습니다.
  scorecard_day: 1


# 알림 채널 — 비워 두면 아무 데도 보내지 않고 기록만 합니다.
#
#   1) 텔레그램에서 @BotFather → /newbot 으로 토큰을 받습니다
#   2) 그 봇에게 아무 말이나 한 번 보낸 뒤 chat_id를 확인합니다
#      curl "https://api.telegram.org/bot<TOKEN>/getUpdates"
#   3) 아래에 적고 `stockscan alert-test`로 지금 확인합니다
#
# ⚠️ 값을 채우면 이 파일에 비밀이 들어갑니다. 백업·공유할 일이 있으면 비워 두고
#    환경변수(STOCKSCAN_TELEGRAM_TOKEN · ..._CHAT_ID)로 넘기세요 — 그쪽이 우선합니다.
telegram:
  token: "<봇 토큰>"
  chat_id: "<채팅 ID>"
