# 추세추종 파이프라인 — 55일 채널 돌파를 한국·미국에서 동시에 훑는다
#
#   symbolUniverse → marketData → strategyRunner → persistSignal → logAlert
#
# 배선은 demo.yaml과 같습니다. 다른 것은 전략 하나뿐입니다 — 노드는 배선이고
# 판단은 전략 클래스 안에 있다는 것이 이 구조의 요점입니다 (§5).
#
# 이 파일이 기본 설정입니다. `~/.marketscan/config.yml`에 두면 인자 없이 실행됩니다.
#
#   cp sample/* ~/.marketscan/     # 설정과 전략을 함께 — 전략은 설정 파일 옆에서 찾습니다
#   uv run marketscan run
#
# ★ 신호 0건인 날이 대부분입니다. 돌파는 상태가 아니라 사건입니다.
#   0건이 이어진다고 breakout을 55에서 20으로 낮추지 마세요 — 그 순간부터
#   Turtle의 표준값이 아니라 제가 고른 값이 됩니다 (§4.8).

pipeline_id: pipe_multimarket_trend
version: 1
name: 멀티마켓 추세추종 55일 돌파

settings:
  user_timezone: Asia/Seoul
  default_mode: notify
  adjusted: true
  max_concurrency: 4

nodes:
  - id: trigger
    type: scheduleTrigger
    params:
      # ★ 시각은 **로컬 기준으로 적고 마감과의 관계를 함께 적습니다.**
      #   마감에서 자동으로 유도하지 않는 이유는 서머타임입니다 — 미국장 마감은
      #   한국 시각으로 1년에 두 번 한 시간씩 움직이는데, 유도한 값은 그 사실을
      #   어디에도 남기지 않습니다. 사람이 적어 두면 전환 때 확인할 수 있습니다.
      timezone: Asia/Seoul
      at:
        - { time: "15:40", market: krx, note: "KRX 마감(15:30) 뒤" }
        - { time: "06:10", market: us, note: "미국장 마감 뒤 — ⚠️ 서머타임에 05:00/06:00으로 움직입니다" }
      # ★ 신호가 0건이어도 하루 1회 보냅니다. 이게 없으면 어느 날부터 시스템이
      #   죽어 있었는지 알 수 없습니다 (§8).
      heartbeat: "09:00"


  - id: universe
    type: symbolUniverse
    params:
      # 유동성 컷은 venue마다 따로 겁니다 (§3.7). 추세추종은 유동성이 얇은 종목에서
      # 가짜 돌파가 잦으므로 이 컷이 12-1에서보다 더 중요합니다.
      venues:
        - venue: krx
          top_by_turnover: 200
        - venue: nasdaq
          limit: 100
    on_error: { policy: retry, max_attempts: 3, fallback: fail }

  - id: data
    type: marketData
    params:
      timeframe: 1d
      # 전략이 253봉을 요구합니다(12개월 모멘텀). 모자라면 그 종목은 통째로 제외됩니다.
      lookback: 320
      closed_only: true
      skip_stale: true         # Fresh Bar Gate — 같은 봉을 두 번 판정하지 않는다
      source: auto
    on_error: { policy: retry, max_attempts: 3, fallback: skip }

  - id: strategy
    type: strategyRunner
    params:
      strategy_id: trend_breakout_55
      params:
        # 전부 공개된 표준값입니다 (Faber 2007 · MOP 2012 · Turtle).
        # 고치기 전에 옆의 trend_breakout_55.py의 docstring을 읽으세요.
        trend_ma: 200
        momentum: 252
        breakout: 55
        exit_channel: 20
        atr: 20
        stop_atr: 2.0
        top_n: 10

  - id: persist
    type: persistSignal
    params:
      kind: entry

  - id: alert
    type: logAlert
    params:
      # 손절가와 손실 폭을 같이 냅니다 — 후보만 보면 "얼마나 틀릴 수 있는가"를
      # 모른 채 판단하게 됩니다.
      template: >-
        [{{instrument.venue}}] {{instrument.display_name}} ·
        추세강도 {{trend_strength}} (순위 {{rank}}/{{universe_size}}) ·
        {{close}} {{instrument.quote_currency}} ·
        손절 {{stop_2n}} ({{risk_pct}})

edges:
  - { id: e1, source: trigger, target: universe }
  - { id: e2, source: universe, target: data }
  - { id: e3, source: data, target: strategy }
  - { id: e4, source: strategy, target: persist }
  - { id: e5, source: persist, target: alert }
