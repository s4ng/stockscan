# 기본 파이프라인 — 코인·한국·미국을 한 번에 훑는 횡단면 모멘텀 12-1
#
#   symbolUniverse → marketData → strategyRunner → persistSignal → logAlert
#
# 기본은 dry-run입니다. 부작용(signals 기록·봉 소비)은 --commit이 있을 때만 열립니다.
#
# ★ 유니버스 노드가 **하나**입니다. 시장마다 노드를 만들어 marketData 하나에 물리면
#   Bundle.merge가 context["universe"]를 덮어써 두 시장이 소리 없이 사라집니다(§4.1).

pipeline_id: pipe_multimarket_momentum
version: 2
name: 멀티마켓 횡단면 모멘텀 12-1

settings:
  user_timezone: Asia/Seoul
  default_mode: notify
  # 업비트 일봉은 UTC 00:00(= KST 09:00)에 마감합니다. 거래소의 실제 경계와 같아야
  # 캘린더가 판정한 as_of와 받아 온 봉의 경계가 어긋나지 않습니다 (11장 1번).
  daily_boundary: UTC00
  adjusted: true
  max_concurrency: 4

nodes:
  - id: trigger
    type: manualTrigger
    params:
      note: 사람이 부르든 스케줄러가 부르든 이 노드에서 시작한다

  # 무엇을 훑을 것인가. 손으로 적지 않고 거래소에 묻습니다 — 종목을 고정해 두면
  # "혼자서는 볼 수 없는 범위를 대신 본다"는 목적에 닿지 않습니다.
  - id: universe
    type: symbolUniverse
    params:
      # 유동성 컷은 **venue마다 따로** 겁니다. 거래대금 단위가 원/달러로 달라
      # 섞어서 한 번에 자르면 비교 자체가 성립하지 않습니다 (§3.7).
      venues:
        - venue: upbit
          quote_currency: KRW    # 원화 마켓만 (BTC·USDT 마켓 제외)
          # 30으로 두면 신규 상장이 워밍업(274봉)에 걸려 절반이 빠지고, 실제로 줄
          # 세우는 대상이 19종목까지 줄어듭니다. 횡단면 랭킹은 표본이 작으면 의미가
          # 옅어지므로 넉넉히 잡습니다. 이건 "얼마나 넓게 볼 것인가"라 전략
          # 파라미터가 아닙니다 — top_pct를 만지는 것과 다릅니다.
          top_by_turnover: 60

        - venue: krx
          top_by_turnover: 200   # FDR 목록이 거래대금(Amount)을 줍니다

        # ⚠️ 미국 목록에는 거래대금이 없습니다(FDR이 심볼·이름만 줌). top_by_turnover를
        #    걸면 전 종목이 탈락하므로 노드가 거부합니다. 대신 limit을 쓰는데,
        #    이건 **소스가 준 순서**(시총 순으로 보이지만 보장은 아님)에 기댑니다.
        - venue: nasdaq
          limit: 100
    on_error: { policy: retry, max_attempts: 3, fallback: fail }

  - id: data
    type: marketData
    params:
      # instruments를 비워 두면 상류 universe가 정한 목록을 씁니다.
      timeframe: 1d
      # 12-1 모멘텀은 273봉이 필요합니다. 모자라면 그 종목은 통째로 제외됩니다.
      lookback: 320
      closed_only: true
      skip_stale: true         # Fresh Bar Gate — 같은 봉을 두 번 판정하지 않는다
      source: auto
    on_error: { policy: retry, max_attempts: 3, fallback: skip }

  - id: strategy
    type: strategyRunner
    params:
      strategy_id: cross_momentum_12_1
      params:
        # 표준값입니다. 백테스트로 고른 값이 아닙니다 (4.8) — 고치기 전에
        # strategies/cross_momentum_12_1.py의 docstring을 읽으세요.
        lookback: 252
        skip: 21
        top_pct: 0.2

  - id: persist
    type: persistSignal
    params:
      kind: entry

  - id: alert
    type: logAlert
    params:
      template: >-
        [{{instrument.venue}}] {{instrument.display_name}} ·
        순위 {{rank}}/{{universe_size}} ·
        모멘텀 {{momentum_12_1}} · {{close}} {{instrument.quote_currency}}

edges:
  - { id: e1, source: trigger, target: universe }
  - { id: e2, source: universe, target: data }
  - { id: e3, source: data, target: strategy }
  - { id: e4, source: strategy, target: persist }
  - { id: e5, source: persist, target: alert }
