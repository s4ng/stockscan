# 추세추종 파이프라인 — 55일 채널 돌파를 코인·한국·미국에서 동시에 훑는다
#
#   symbolUniverse → marketData → strategyRunner → persistSignal → logAlert
#
# 배선은 demo.yaml과 같습니다. 다른 것은 전략 하나뿐입니다 — 노드는 배선이고
# 판단은 전략 클래스 안에 있다는 것이 이 구조의 요점입니다 (§5).
#
#   uv run marketscan run -p pipelines/trend.yaml
#
# ★ 신호 0건인 날이 대부분입니다. 돌파는 상태가 아니라 사건입니다.
#   0건이 이어진다고 breakout을 55에서 20으로 낮추지 마세요 — 그 순간부터
#   Turtle의 표준값이 아니라 제가 고른 값이 됩니다 (§4.8).

pipeline_id: pipe_multimarket_trend
version: 1
name: 멀티마켓 추세추종 55일 돌파

settings:
  user_timezone: Asia/Seoul
  default_mode: notify
  daily_boundary: UTC00
  adjusted: true
  max_concurrency: 4

nodes:
  - id: trigger
    type: manualTrigger
    params:
      note: 사람이 부르든 스케줄러가 부르든 이 노드에서 시작한다

  - id: universe
    type: symbolUniverse
    params:
      # 유동성 컷은 venue마다 따로 겁니다 (§3.7). 추세추종은 유동성이 얇은 종목에서
      # 가짜 돌파가 잦으므로 이 컷이 12-1에서보다 더 중요합니다.
      venues:
        - venue: upbit
          quote_currency: KRW
          top_by_turnover: 60
        - venue: krx
          top_by_turnover: 200
        - venue: nasdaq
          limit: 100
    on_error: { policy: retry, max_attempts: 3, fallback: fail }

  - id: data
    type: marketData
    params:
      timeframe: 1d
      # 전략이 253봉을 요구합니다(12개월 모멘텀). 모자라면 그 종목은 통째로 제외됩니다.
      lookback: 320
      closed_only: true
      skip_stale: true         # Fresh Bar Gate — 같은 봉을 두 번 판정하지 않는다
      source: auto
    on_error: { policy: retry, max_attempts: 3, fallback: skip }

  - id: strategy
    type: strategyRunner
    params:
      strategy_id: trend_breakout_55
      params:
        # 전부 공개된 표준값입니다 (Faber 2007 · MOP 2012 · Turtle).
        # 고치기 전에 strategies/trend_breakout_55.py의 docstring을 읽으세요.
        trend_ma: 200
        momentum: 252
        breakout: 55
        exit_channel: 20
        atr: 20
        stop_atr: 2.0
        top_n: 10

  - id: persist
    type: persistSignal
    params:
      kind: entry

  - id: alert
    type: logAlert
    params:
      # 손절가와 손실 폭을 같이 냅니다 — 후보만 보면 "얼마나 틀릴 수 있는가"를
      # 모른 채 판단하게 됩니다.
      template: >-
        [{{instrument.venue}}] {{instrument.display_name}} ·
        추세강도 {{trend_strength}} (순위 {{rank}}/{{universe_size}}) ·
        {{close}} {{instrument.quote_currency}} ·
        손절 {{stop_2n}} ({{risk_pct}})

edges:
  - { id: e1, source: trigger, target: universe }
  - { id: e2, source: universe, target: data }
  - { id: e3, source: data, target: strategy }
  - { id: e4, source: strategy, target: persist }
  - { id: e5, source: persist, target: alert }
