{% if reports %}
<div class="scroll"><table>
<thead><tr><th>리포트</th><th>종류</th><th>크기</th><th>생성</th></tr></thead>
<tbody>
{% for r in reports %}
<tr>
  <td><a href="/reports/{{ r.name }}" target="_blank">{{ r.name }}</a></td>
  <td>{{ r.kind }}</td>
  <td>{{ r.size_kb }} KB</td>
  <td>{{ r.modified }}</td>
</tr>
{% endfor %}
</tbody></table></div>
{% else %}
<p class="muted">아직 리포트가 없습니다. 위에서 실행하거나 백테스트를 돌리면 생깁니다.</p>
{% endif %}
