{# 서버 렌더 한 장. **빌드 단계가 없다** — Node·pnpm을 저장소에 다시 들이지 않는다. #}
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · marketscan</title>
<style>
:root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --muted:#666;
        --line:#e2e2e2; --head:#f6f6f6; --accent:#1565c0;
        --ok-bg:#e8f5e9; --ok-line:#43a047; --warn-bg:#fff8e1; --warn-line:#e6c200;
        --err-bg:#ffebee; --err-line:#d32f2f; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#16181c; --fg:#e8e8e8; --muted:#9aa0a6; --line:#2c2f36; --head:#1e2127;
          --accent:#64b5f6; --ok-bg:#15291a; --ok-line:#2e7d32;
          --warn-bg:#2a2410; --warn-line:#8a7300; --err-bg:#2b1416; --err-line:#c62828; }
}
* { box-sizing: border-box; }
body { margin:0; padding:0 1.25rem 3rem; background:var(--bg); color:var(--fg);
       font:14px/1.6 ui-sans-serif, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { max-width: 1100px; margin: 0 auto; }
header { display:flex; align-items:baseline; gap:1rem; padding:1.25rem 0 1rem;
         border-bottom:1px solid var(--line); margin-bottom:1.5rem; }
header h1 { font-size:1.15rem; margin:0; }
header nav a { color:var(--muted); text-decoration:none; margin-right:.75rem; }
header nav a:hover { color:var(--fg); }
h2 { font-size:.85rem; margin:2rem 0 .6rem; color:var(--muted);
     text-transform:uppercase; letter-spacing:.06em; }
a { color:var(--accent); }
.flash { padding:.7rem 1rem; border-radius:0 4px 4px 0; margin:0 0 1.25rem; }
.flash.ok { background:var(--ok-bg); border-left:3px solid var(--ok-line); }
.flash.warn { background:var(--warn-bg); border-left:3px solid var(--warn-line); }
.flash.error { background:var(--err-bg); border-left:3px solid var(--err-line); }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:1.25rem; }
.card { border:1px solid var(--line); border-radius:6px; padding:1rem 1.1rem; }
.card h3 { margin:0 0 .6rem; font-size:.95rem; }
.scroll { overflow-x:auto; }
/* 카드 안의 키-값 표는 줄바꿈을 허용한다. 전역 nowrap을 그대로 두면 긴 경로
   (C:\Users\...\.marketscan)가 카드를 뚫고 나간다. */
.kv { table-layout:fixed; width:100%; }
.kv th { width:8.5rem; }
.kv th, .kv td { white-space:normal; overflow-wrap:anywhere; vertical-align:top; }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:.4rem .6rem; border-bottom:1px solid var(--line);
         white-space:nowrap; }
th { background:var(--head); font-weight:600; }
form { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin:.4rem 0 0; }
input, select, button { font:inherit; padding:.35rem .5rem; border-radius:4px;
        border:1px solid var(--line); background:var(--bg); color:var(--fg); }
button { cursor:pointer; border-color:var(--accent); color:var(--accent); background:transparent; }
button:hover:not(:disabled) { background:var(--head); }
button:disabled { opacity:.65; cursor:progress; }

/* 실행 중 표시. 누른 뒤 아무 반응이 없으면 사람은 한 번 더 누르고,
   기록 실행에서 그건 같은 봉을 두 번 소비하는 길이다. */
button.busy::after {
  content:''; display:inline-block; width:.85em; height:.85em; margin-left:.5em;
  vertical-align:-.1em; border:2px solid currentColor; border-right-color:transparent;
  border-radius:50%; animation:spin .7s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* 기록 토글. 켜면 색이 바뀌어 "지금은 기록 모드"가 한눈에 보인다. */
.toggle { display:inline-flex; align-items:center; gap:.45rem; cursor:pointer;
          color:var(--muted); user-select:none; }
.toggle input { position:absolute; opacity:0; width:0; height:0; }
.toggle .track { width:2.4rem; height:1.3rem; border-radius:999px; background:var(--line);
                 position:relative; transition:background .15s; flex:none; }
.toggle .track::after { content:''; position:absolute; top:.15rem; left:.15rem;
                        width:1rem; height:1rem; border-radius:50%; background:var(--bg);
                        box-shadow:0 1px 2px rgba(0,0,0,.3); transition:transform .15s; }
.toggle input:checked + .track { background:var(--err-line); }
.toggle input:checked + .track::after { transform:translateX(1.1rem); }
.toggle input:checked ~ .label { color:var(--err-line); font-weight:600; }
.muted { color:var(--muted); }
.note { color:var(--muted); font-size:.9rem; margin:.5rem 0 0; }
code { background:var(--head); padding:.05rem .3rem; border-radius:3px; }
</style>
</head>
<body>
<main>
<header>
  <h1><a href="/" style="text-decoration:none;color:inherit">marketscan</a></h1>
  <nav>
    <a href="/reports">리포트</a>
  </nav>
</header>

{% if flash %}
<div class="flash {{ flash.kind }}">
  {{ flash.message }}
  {% if flash.link %} · <a href="{{ flash.link }}" target="_blank">{{ flash.link_text }}</a>{% endif %}
</div>
{% endif %}

{% block content %}{% endblock %}
</main>
<script>
// 실행 중인 버튼에 스피너를 물리고 폼을 잠근다. 되돌릴 수 없는 실행(기록)에서
// 연타가 가장 위험하므로 **모든** 폼에 건다.
document.addEventListener('submit', (event) => {
  const form = event.target;
  const recording = form.querySelector('input[name="commit"]:checked');
  if (recording && !confirm('기록 실행입니다. signals에 남고 봉이 소비됩니다. 계속할까요?')) {
    event.preventDefault();
    return;
  }
  const pressed = event.submitter;
  // 값 수집이 끝난 뒤에 잠근다 — 지금 disabled로 만들면 누른 버튼의 name/value가
  // 함께 사라져서 '캐시에 쌓기'가 '계획 보기'로 둔갑한다.
  setTimeout(() => {
    form.querySelectorAll('button').forEach((b) => { b.disabled = true; });
    if (pressed) pressed.classList.add('busy');
  }, 0);
});
</script>
</body>
</html>
