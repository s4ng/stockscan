[project]
name = "marketscan"
version = "0.1.0"
description = "Multi-market cross-sectional screener and signal alerts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "networkx>=3.4",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    # 파이프라인 정의 형식 — YAML로 확정 (11장 4번). 저장 스냅샷은 JSON 그대로다.
    "pyyaml>=6.0",
    # 코인 일봉. 거래소당 어댑터를 만들지 않기 위한 유일한 이유다 (3.3).
    "ccxt>=4.4",
]

[project.scripts]
marketscan = "app.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
