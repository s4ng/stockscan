[project]
name = "marketscan"
version = "0.1.0"
description = "매수 후보를 뽑아 텔레그램으로 보내 주는 개인용 스크리너"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    # 파이프라인 정의 형식 — YAML로 확정 (11장 4번). 저장 스냅샷은 JSON 그대로다.
    "pyyaml>=6.0",
    # ⚠️ 1.2.x로 올리지 못하고 있다. 1.2.3부터 pkg_resources를 버려(좋다) 아래 setuptools
    #    핀이 필요 없어지지만, 같은 릴리스부터 `pandas<3.0` 상한이 붙는다. 우리는 3.0.5를
    #    쓰므로 올리는 순간 **pandas가 메이저로 내려간다** — 소스 하나 때문에 코어 라이브러리를
    #    되돌릴 일은 아니다. 재검토 조건: pykrx가 pandas 3을 허용하면 그때 올리고,
    #    아래 setuptools 핀과 pykrx_source.py의 경고 필터를 **함께** 지운다.
    "pykrx>=1.0.51,<1.2",
    "finance-datareader>=0.9.202",
    "yfinance>=1.5.2",
    "exchange-calendars>=4.13.2",
    # pykrx 1.0.x가 임포트 시점에 pkg_resources를 부른다. 81+에서 사라질 예정이라
    # 핀으로 붙잡아 둔 것이고, **우리가 쓰는 곳은 없다.** 위 pykrx 주석의 재검토
    # 조건이 충족되면 이 줄부터 지운다.
    "setuptools<81",
]

[project.scripts]
marketscan = "app.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
